<!-- Floating Action Group: WhatsApp Chat + Grupo VIP -->
<style>
  .floating-action-group {
    position: fixed;
    bottom: 28px;
    right: 28px;
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 1030;
    pointer-events: auto;
  }

  /* Oculta quando qualquer modal ou gaveta offcanvas estiver aberta para não sobrepor o conteúdo no celular */
  body.modal-open .floating-action-group,
  body.offcanvas-open .floating-action-group,
  .modal.show ~ .floating-action-group,
  .modal-backdrop.show ~ .floating-action-group {
    display: none !important;
    opacity: 0 !important;
    visibility: hidden !important;
    pointer-events: none !important;
  }

  /* Botão 1: Grupo do WhatsApp (à esquerda) */
  .whatsapp-group-float-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
    color: #f8fafc !important;
    border: 1.5px solid rgba(255, 255, 255, 0.15);
    border-radius: 50px;
    padding: 10px 16px;
    text-decoration: none !important;
    font-family: inherit;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.2px;
    box-shadow: 0 6px 20px rgba(15, 23, 42, 0.35);
    transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  .whatsapp-group-float-btn:hover {
    transform: translateY(-2px) scale(1.04);
    background: linear-gradient(135deg, #0f172a 0%, #020617 100%);
    border-color: rgba(37, 211, 102, 0.5);
    box-shadow: 0 10px 24px rgba(15, 23, 42, 0.45);
    color: #25d366 !important;
  }

  .whatsapp-group-float-btn i {
    font-size: 17px;
    color: #25d366;
  }

  /* Botão 2: WhatsApp Direto - Minimalista Apenas Símbolo (à direita) */
  .whatsapp-float-btn {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
    color: #ffffff !important;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 24px rgba(37, 211, 102, 0.45);
    text-decoration: none !important;
    position: relative;
    transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    animation: floatPulse 3s infinite ease-in-out;
  }

  .whatsapp-float-btn:hover {
    transform: scale(1.08) translateY(-2px);
    box-shadow: 0 12px 28px rgba(37, 211, 102, 0.6);
    color: #ffffff !important;
  }

  .whatsapp-float-icon {
    font-size: 26px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .whatsapp-float-badge {
    position: absolute;
    top: -2px;
    right: -2px;
    background: #ff3b30;
    color: #fff;
    font-size: 9px;
    font-weight: bold;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid #fff;
  }

  @keyframes floatPulse {
    0% {
      box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.6);
    }
    70% {
      box-shadow: 0 0 0 12px rgba(37, 211, 102, 0);
    }
    100% {
      box-shadow: 0 0 0 0 rgba(37, 211, 102, 0);
    }
  }

  @media (max-width: 576px) {
    .floating-action-group {
      bottom: 74px;
      right: 14px;
      gap: 8px;
    }
    .whatsapp-group-float-btn {
      padding: 8px 12px;
      font-size: 12px;
    }
    .whatsapp-group-float-btn i {
      font-size: 15px;
    }
    .whatsapp-float-btn {
      width: 44px;
      height: 44px;
    }
    .whatsapp-float-icon {
      font-size: 23px;
    }
  }
</style>

<div class="floating-action-group">
  <!-- Botão 1: Grupo do WhatsApp (à esquerda) -->
  <a href="{{ STORE_WHATSAPP_GROUP_URL|default:'https://chat.whatsapp.com/EoQm1858BrK36Uvjs6dYRG?mode=gi_t' }}"
     target="_blank"
     class="whatsapp-group-float-btn"
     aria-label="Entrar no Grupo VIP do WhatsApp"
     title="Entrar no Grupo VIP de Novidades & Promoções">
    <i class="bx bxs-group"></i>
    <span>Grupo VIP</span>
  </a>

  <!-- Botão 2: Fale Conosco no WhatsApp - Minimalista Apenas Símbolo (à direita) -->
  <a href="{{ STORE_WHATSAPP_URL|default:'https://wa.me/558183983355' }}?text=Olá!%20Gostaria%20de%20um%20atendimento%20VIP%20na%20Vakaria."
     target="_blank"
     class="whatsapp-float-btn"
     aria-label="Fale conosco no WhatsApp"
     title="Falar no WhatsApp (Atendimento VIP)">
    <span class="whatsapp-float-icon">
      <i class="bx bxl-whatsapp"></i>
    </span>
    <span class="whatsapp-float-badge" title="Online">1</span>
  </a>
</div>
